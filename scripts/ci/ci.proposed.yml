name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Les tests API (detect, quarantine, alerts) écrivent dans PostgreSQL :
    # la base de test est créée et migrée avant la suite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar

    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Schéma et migrations (base de test)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          for f in db/migrate-*.sql; do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/sources.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/detection-rules.sql

      # Le contrat est une fonction pure : aucune base requise. Placé tôt pour
      # qu'un échec de contrat soit lisible immédiatement.
      - name: Contrat d'événement (hors base)
        run: |
          ./apps/api/node_modules/.bin/tsx --test \
            apps/api/test/contract-admit.test.ts \
            apps/api/test/contract-families.test.ts

      - name: Typecheck API
        run: pnpm -F @radar/api typecheck

      - name: Typecheck web
        run: pnpm -F @radar/web typecheck

      - name: Tests API
        run: pnpm -F @radar/api test

      - name: Tests de rendu
        run: pnpm -F @radar/web run test:render

      - name: Tests d'interaction (jsdom)
        run: pnpm -F @radar/web run test:dom

      - name: Build web
        run: pnpm -F @radar/web build

  # Rejoue l'installation par le chemin qu'emprunte un humain : `pnpm setup`.
  #
  # Le job `verify` applique le schéma via psql, en contournant
  # scripts/migrate.mts. C'est précisément pourquoi il n'a jamais vu l'amorçage
  # qui marquait 17 migrations « appliquées » sur une base neuve sans les jouer,
  # ni les scripts racine incapables de résoudre `pg`. Un socle ne se vérifie
  # qu'en le rejouant depuis le vide, puis une seconde fois pour l'idempotence.
  socle:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: socle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d socle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/socle
      RADAR_ADMIN_PASSWORD: ci-jetable-sans-secret
      RADAR_ADMIN_EMAIL: ci@radar.local

    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Bootstrap depuis une base vide
        run: pnpm setup

      - name: Diagnostic (doit annoncer toutes les étapes en place)
        run: pnpm setup:check

      - name: Rejeu (idempotence)
        run: |
          pnpm setup > /tmp/rejeu.txt 2>&1
          cat /tmp/rejeu.txt
          # Aucun doublon : les sources doivent annoncer +0.
          grep -E 'sources .*\(\+0\)' /tmp/rejeu.txt
          # Et le compte d'organisations ne doit pas avoir bougé.
          test "$(grep -c '4462 orgs' /tmp/rejeu.txt)" -ge 1

      - name: Plan du référentiel (sans écriture)
        run: ./apps/api/node_modules/.bin/tsx scripts/load-referentiel-na.mts --plan-only
