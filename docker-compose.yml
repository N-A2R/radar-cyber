# Radar Cyber NA — déploiement conteneurisé.
#
# Services : db (PostgreSQL 18), migrate (one-shot), api (Fastify :8080),
#            web (serveur statique Node :4173), tor (profil optionnel, SOCKS5 9050).
# Variables : voir .env.example (copier en .env ou exporter).
#
# Usage :
#   docker compose up -d
#   docker compose --profile tor up -d      # active le routage .onion
#   docker compose run --rm migrate         # rejouer les migrations

name: radar-cyber

x-db-credentials: &db-credentials
  POSTGRES_USER: ${POSTGRES_USER:-radar}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
  POSTGRES_DB: ${POSTGRES_DB:-radar}

x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/${POSTGRES_DB:-radar}

x-api-env: &api-env
  <<: *database-url
  HOST: "0.0.0.0"
  PORT: "8080"
  NODE_ENV: "production"
  RADAR_AUDIT_PEPPER: ${RADAR_AUDIT_PEPPER:?RADAR_AUDIT_PEPPER requis}
  RADAR_CORS_ORIGINS: ${RADAR_CORS_ORIGINS:-}
  RADAR_TRUST_PROXY: ${RADAR_TRUST_PROXY:-0}
  RADAR_COOKIE_SECURE: ${RADAR_COOKIE_SECURE:-}
  RADAR_AUDIT_RETENTION_DAYS: ${RADAR_AUDIT_RETENTION_DAYS:-90}
  RADAR_RATE_LIMIT_MAX: ${RADAR_RATE_LIMIT_MAX:-300}
  RADAR_RATE_LIMIT_WINDOW_MS: ${RADAR_RATE_LIMIT_WINDOW_MS:-60000}
  RADAR_PUBLIC_READ_RPM: ${RADAR_PUBLIC_READ_RPM:-120}
  RADAR_SESSION_READ_RPM: ${RADAR_SESSION_READ_RPM:-600}
  RADAR_TSA_URL: ${RADAR_TSA_URL:-}
  RADAR_TSA_CA_PEM: ${RADAR_TSA_CA_PEM:-}
  RADAR_TSA_PRESTATAIRE_ANSSI: ${RADAR_TSA_PRESTATAIRE_ANSSI:-}
  RADAR_TOR_SOCKS: ${RADAR_TOR_SOCKS:-socks5h://tor:9050}
  RADAR_COLLECT: ${RADAR_COLLECT:-1}
  RADAR_WEB_BASE_URL: ${RADAR_WEB_BASE_URL:-}
  INCEPTION_API_KEY: ${INCEPTION_API_KEY:-}
  RADAR_RETENTION_DAYS: ${RADAR_RETENTION_DAYS:-90}
  RADAR_RETENTION_INDICATOR_DAYS: ${RADAR_RETENTION_INDICATOR_DAYS:-365}
  RADAR_ALERT_WEBHOOK_URL: ${RADAR_ALERT_WEBHOOK_URL:-}
  RADAR_ALERT_WEBHOOK_SECRET: ${RADAR_ALERT_WEBHOOK_SECRET:-}
  RADAR_ALERT_TELEGRAM_BOT_TOKEN: ${RADAR_ALERT_TELEGRAM_BOT_TOKEN:-}
  RADAR_ALERT_TELEGRAM_CHAT_ID: ${RADAR_ALERT_TELEGRAM_CHAT_ID:-}
  RADAR_ALERT_EMAIL_HOST: ${RADAR_ALERT_EMAIL_HOST:-}
  RADAR_ALERT_EMAIL_PORT: ${RADAR_ALERT_EMAIL_PORT:-587}
  RADAR_ALERT_EMAIL_USER: ${RADAR_ALERT_EMAIL_USER:-}
  RADAR_ALERT_EMAIL_PASSWORD: ${RADAR_ALERT_EMAIL_PASSWORD:-}
  RADAR_ALERT_EMAIL_FROM: ${RADAR_ALERT_EMAIL_FROM:-}
  RADAR_ALERT_EMAIL_TO: ${RADAR_ALERT_EMAIL_TO:-}
  RADAR_ALERT_EMAIL_SECURE: ${RADAR_ALERT_EMAIL_SECURE:-false}
  RADAR_ALERT_DELIVERY_TICK_MS: ${RADAR_ALERT_DELIVERY_TICK_MS:-120000}
  RADAR_ALERT_FATIGUE_TICK_MS: ${RADAR_ALERT_FATIGUE_TICK_MS:-60000}
  TZ: ${TZ:-Europe/Paris}

services:
  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    # Le répertoire de données reste un volume ; le reste du rootfs est lu seul.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=1m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Minimum de capacités nécessaires à l'entrypoint officiel (chown du volume, gosu).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    pids_limit: 200
    mem_limit: 2g
    environment:
      <<: *db-credentials
      TZ: ${TZ:-Europe/Paris}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    volumes:
      # PostgreSQL 18 attend un montage unique sur /var/lib/postgresql :
      # le répertoire de version est créé à l'intérieur du volume.
      - pgdata:/var/lib/postgresql
      # Répertoire des dumps (pg_dump / restauration).
      - dumps:/dumps
      # Schéma de base MVP ; les migrations complètent au démarrage.
      - ./db/init.sql:/docker-entrypoint-initdb.d/010-init.sql:ro
    ports:
      - "127.0.0.1:${RADAR_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-radar} -d $${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: radar-cyber-api:local
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 1g
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *database-url
      TZ: ${TZ:-Europe/Paris}
    # Garde-fou pour scripts/migrate.mts : sur une base vierge il marque
    # historiquement un lot de migrations comme "appliquées" (amorçage d'une
    # base live) et les saute. On pré-crée schema_migrations avec une entrée
    # sentinelle pour désactiver cet amorçage, puis migrate.mts applique
    # TOUTES les db/migrate-*.sql manquantes (idempotent aux relances).
    command:
      - sh
      - -ec
      - |
        cd /app/apps/api
        node --input-type=module -e '
          import pg from "pg";
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await c.connect();
          await c.query("CREATE TABLE IF NOT EXISTS schema_migrations (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())");
          const { rows } = await c.query("SELECT count(*)::int AS n FROM schema_migrations");
          if (rows[0].n === 0) {
            await c.query("INSERT INTO schema_migrations (version) VALUES ($1) ON CONFLICT DO NOTHING", ["__container_bootstrap__"]);
          }
          await c.end();
        '
        cd /app
        exec ./apps/api/node_modules/.bin/tsx scripts/migrate.mts

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: radar-cyber-api:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 300
    mem_limit: 2g
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${RADAR_API_PORT:-8080}:8080"
    volumes:
      - dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${PORT:-8080}/api/health\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: radar-cyber-web:local
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 100
    mem_limit: 512m
    init: true
    depends_on:
      api:
        condition: service_started
    environment:
      WEB_PORT: "4173"
      API_PROXY_TARGET: http://api:8080
      TZ: ${TZ:-Europe/Paris}
    ports:
      - "127.0.0.1:${RADAR_WEB_PORT:-4173}:4173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4173/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Tor (optionnel) — SOCKS5 pour les sources .onion.
  # L'API est configurée par défaut avec RADAR_TOR_SOCKS=socks5h://tor:9050 ;
  # sans ce service (--profile tor), les collectes .onion échouent immédiatement
  # (aucun repli clearnet), ce qui est le comportement attendu.
  tor:
    build:
      context: .
      dockerfile: docker/tor/Dockerfile
    image: radar-cyber-tor:local
    profiles: ["tor"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # État Tor éphémère et non persistant : le procès tourne en uid 10001,
    # aucun apk ni écriture root à l'exécution. Aucun port publié sur l'hôte :
    # SocksPort n'écoute que sur le réseau Compose.
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/lib/tor:size=32m,mode=0700,uid=10001,gid=10001
    pids_limit: 100
    mem_limit: 256m

volumes:
  pgdata:
  dumps:
