name: CI

# CI à étages — qui tourne quand :
#
#   PR          : changes → contracts (typechecks) + api-smoke (tests affectés,
#                 2 workers) → verify. C'est la porte de merge : rapide, ciblée.
#   merge queue : TOUT (la matrix 8 shards, web, e2e, socle, supply-chain).
#                 Un lot ne merge que vert. Règle active sur N-A2R avec
#                 le check requis `verify`.
#   main        : aucun run. Le commit vérifié par le merge group est celui qui
#                 atterrit sur main ; relancer la suite après le merge ne
#                 vérifiait rien de neuf et coûtait un run complet par merge.
#                 Les durées réelles sont collectées par le merge group.
#   nightly     : TOUT + tests d'objectifs.
#
# Le label `full-ci` sur une PR élargit la sélection aux 408 fichiers dans le
# smoke (la matrix reste réservée aux événements non-PR).

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# Une branche qui pousse plusieurs fois de suite annule ses runs périmés.
# La nightly n'est jamais annulée : c'est elle qui porte les vérifications
# lourdes, et son ref est refs/heads/main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Nombre de shards API : identique à la matrix `api-tests` et au plan vérifié
# par `shard-files.ts --list --check`.
env:
  API_SHARDS: "8"

jobs:
  # Filtre les jobs selon les chemins touchés. Les événements non-PR
  # (merge queue, nightly) lancent tout : aucun chemin ne doit
  # échapper à la vérification complète.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
      schema: ${{ steps.filter.outputs.schema }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "schema=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA...$GITHUB_SHA" > /tmp/changed.txt
          api=false
          web=false
          infra=false
          schema=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*)
                : ;;
              .github/workflows/*|.github/actions/*)
                api=true; web=true; infra=true; schema=true ;;
              apps/*/Dockerfile*|.dockerignore|Caddyfile)
                infra=true; schema=true ;;
              apps/api/package.json)
                api=true; infra=true; schema=true ;;
              apps/api/*|bench/*)
                api=true ;;
              db/*|scripts/*)
                api=true; schema=true ;;
              apps/*/package.json)
                web=true; infra=true; schema=true ;;
              apps/web/*)
                web=true ;;
              sdks/*|tests/*)
                api=true; web=true ;;
              packages/*|pnpm-lock.yaml|pnpm-workspace.yaml|package.json|tsconfig*.json)
                api=true; web=true; infra=true; schema=true ;;
              docker*|Dockerfile*)
                infra=true; schema=true ;;
              *)
                # Chemin inconnu : on ne prend jamais le risque de tout sauter.
                api=true; web=true; infra=true; schema=true ;;
            esac
          done < /tmp/changed.txt

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "api=$api web=$web infra=$infra schema=$schema"

  # Contrats, typechecks et migrations : aucune base nécessaire.
  # Sur PR, c'est la moitié de la porte de merge (l'autre est api-smoke) ;
  # sur les autres événements, il précède la suite complète.
  contracts:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Contrat hors base (en premier)
        run: |
          ./apps/api/node_modules/.bin/tsx --test \
            apps/api/test/contract-admit.test.ts \
            apps/api/test/contract-families.test.ts

      - name: Typechecks (API, web, tests, SDK)
        run: |
          pnpm -F @radar/api typecheck
          pnpm -F @radar/web typecheck
          pnpm typecheck:tests
          pnpm typecheck:sdk

      - name: Tests migrations et outillage
        run: pnpm test:migrations

      - name: Tests objectifs (nightly)
        if: github.event_name == 'schedule'
        run: pnpm test:objectifs

      - name: Plan des shards API (sans base)
        run: |
          ./apps/api/node_modules/.bin/tsx apps/api/test/shard-files.ts \
            --shards="$API_SHARDS" --list --check

  # Porte de merge d'une PR : uniquement les tests affectés par le diff,
  # en deux workers (une base jetable chacun). Un diff limité aux workflows et
  # actions GitHub utilise un canari de six tests ; la merge queue et la
  # nightly reprennent la suite complète. Le label `full-ci` la force aussi.
  # Les autres chemins critiques (schéma, serveur, auth, helpers) restent full.
  # La matrix 8 shards, elle, reste aux événements non-PR.
  api-smoke:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && '1' || '0' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup

      - name: Tests API affectés par la PR
        run: |
          ./apps/api/node_modules/.bin/tsx apps/api/test/affected-tests.ts > /tmp/api-smoke.txt
          if [ ! -s /tmp/api-smoke.txt ]; then
            echo "aucun test affecté"
            exit 0
          fi
          echo "$(wc -l < /tmp/api-smoke.txt) fichier(s) affecté(s)"
          cd apps/api
          mapfile -t files < /tmp/api-smoke.txt
          if [ "${#files[@]}" -le 4 ]; then
            ./node_modules/.bin/tsx test/run.ts "${files[@]}"
          else
            ./node_modules/.bin/tsx test/parallel/run.ts "${files[@]}"
          fi

  # Suite complète en 8 shards : merge queue et nightly uniquement.
  # Chaque matrix job a son propre service PostgreSQL et `test/run.ts` y crée
  # une base jetable dédiée : une base par shard, aucun état partagé.
  # fail-fast: false laisse tous les verdicts s'exprimer ; un shard en échec
  # fait échouer la matrix, puis le job agrégateur `verify`.
  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, runner: ubuntu-latest }
          - { shard: 2, runner: ubuntu-latest }
          - { shard: 3, runner: ubuntu-latest }
          - { shard: 4, runner: ubuntu-latest }
          - { shard: 5, runner: ubuntu-latest }
          - { shard: 6, runner: ubuntu-latest }
          - { shard: 7, runner: ubuntu-latest }
          - { shard: 8, runner: ubuntu-latest }

    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') && '1' || '0' }}
      RADAR_SHARD_WEIGHTS_OUT: /tmp/api-durations/shard-${{ matrix.shard }}.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup

      - name: Fichiers du shard ${{ matrix.shard }}
        run: |
          ./apps/api/node_modules/.bin/tsx apps/api/test/affected-tests.ts \
            --shards="$API_SHARDS" --index=${{ matrix.shard }} > /tmp/api-shard.txt
          if [ -s /tmp/api-shard.txt ]; then
            echo "$(wc -l < /tmp/api-shard.txt) fichier(s) affecté(s) — shard ${{ matrix.shard }}/$API_SHARDS"
          else
            echo "aucun test affecté — shard ${{ matrix.shard }} ignoré"
          fi

      # Séquentiel partout : merge queue et nightly produisent les durées réelles qui
      # pondèrent le shard plan. Le parallélisme par shard est le rôle du
      # smoke sur PR.
      - name: Tests API (shard ${{ matrix.shard }})
        shell: bash
        working-directory: apps/api
        run: |
          mkdir -p /tmp/api-durations
          if [ ! -s /tmp/api-shard.txt ]; then
            echo "aucun test affecté — shard ${{ matrix.shard }} ignoré"
            exit 0
          fi
          mapfile -t files < /tmp/api-shard.txt
          ./node_modules/.bin/tsx test/run.ts \
            --test-reporter=spec \
            --test-reporter=./test/duration-reporter.mjs \
            --test-reporter-destination=stdout \
            --test-reporter-destination=/tmp/api-durations/reporter-${{ matrix.shard }}.txt \
            "${files[@]}"

      - name: Durées du shard ${{ matrix.shard }} (artifact)
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-durations-${{ matrix.shard }}
          path: /tmp/api-durations/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 14

  # Les durées sont un appoint du planning, jamais un verdict : ce job est
  # non bloquant et absent de `verify`, même si un shard a échoué.
  duration-weights:
    needs: api-tests
    if: always() && needs.api-tests.result != 'skipped' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: api-durations-*
          path: /tmp/api-durations

      - name: Fusion des durées
        shell: bash
        run: |
          shopt -s nullglob
          files=(/tmp/api-durations/api-durations-*/shard-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "aucune durée collectée — aucun plan publié"
            exit 0
          fi
          node apps/api/test/merge-durations.mjs /tmp/shard-weights.json "${files[@]}"

      - name: Plan de durées (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-shard-weights
          path: /tmp/shard-weights.json
          if-no-files-found: ignore
          retention-days: 30

  # --- Suite complète (merge queue, nightly) ---

  web-unit:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Tests web (Vitest, jsdom, rendu)
        run: |
          pnpm -F @radar/web run test:unit
          pnpm -F @radar/web run test:offline-pwa
          pnpm -F @radar/web run test:render
          pnpm -F @radar/web run test:dom
          pnpm -F @radar/web run storybook:coverage

  playwright:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Cache des navigateurs Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Tests web de bout en bout (Playwright)
        run: |
          pnpm -F @radar/web exec playwright install --with-deps chromium
          pnpm -F @radar/web run test:e2e

  sdks-python:
    needs: changes
    if: (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Tests SDK TypeScript et Python
        run: pnpm test:sdks

      - name: Tests Python du socle
        run: pnpm test:python

  provenance:
    needs: changes
    if: needs.changes.outputs.schema == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # La mesure porte sur une base jetable migrée puis peuplée d'une fixture
    # NA déterministe : le jeu réel ne peut pas être cloné dans le CI.
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Schéma et migrations (base de mesure)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/init.sql
          pnpm migrate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/sources.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/detection-rules.sql

      - name: Fixture Nouvelle-Aquitaine (provenance réelle, sans donnée personnelle)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/fixtures/provenance-ci.sql

      - name: Provenance sur mesure fraîche (blocking)
        run: |
          pnpm provenance:measure:ci
          pnpm provenance:check:ci

  build:
    needs: changes
    if: needs.changes.outputs.web == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-setup

      - name: Build web
        run: pnpm -F @radar/web build

  # Rejoue l'installation par le chemin qu'emprunte un humain : `pnpm setup`.
  # Le job verify appliquait autrefois le schéma par psql et contournait
  # scripts/migrate.mts : il ne voyait ni l'amorçage mensonger ni le défaut de
  # résolution de `pg`. Un socle ne se vérifie qu'en le rejouant depuis le vide,
  # puis une seconde fois pour l'idempotence et sur une base COPIÉE.
  socle:
    needs: changes
    if: needs.changes.outputs.schema == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: socle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d socle"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/socle
      ADMIN_URL: postgres://radar:radar@localhost:5432/postgres
      RADAR_ADMIN_PASSWORD: ci-jetable-sans-secret
      RADAR_ADMIN_EMAIL: ci@radar.local

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/ci-setup

      - name: Bootstrap depuis une base vide
        run: pnpm setup

      - name: Diagnostic (doit annoncer toutes les étapes en place)
        run: |
          set -o pipefail
          pnpm setup:check | tee /tmp/socle-diagnostic.txt
          grep -Eq 'référentiel NA +[1-9][0-9]* orgs / [0-9]+ alias' /tmp/socle-diagnostic.txt

      - name: Rejeu (idempotence)
        run: |
          pnpm setup > /tmp/rejeu.txt 2>&1
          cat /tmp/rejeu.txt
          grep -E 'sources .*\(\+0\)' /tmp/rejeu.txt
          test "$(grep -Ec 'référentiel NA +[1-9][0-9]* orgs / [0-9]+ alias' /tmp/rejeu.txt)" -ge 1
          reference_before="$(sed -nE 's/.*référentiel NA +([0-9]+) orgs \/ ([0-9]+) alias.*/\1 \2/p' /tmp/socle-diagnostic.txt)"
          reference_after="$(sed -nE 's/.*référentiel NA +([0-9]+) orgs \/ ([0-9]+) alias.*/\1 \2/p' /tmp/rejeu.txt)"
          test -n "$reference_before"
          test "$reference_before" = "$reference_after"

      - name: Base copiée — migrations sans rejeu destructif
        env:
          COPIE_URL: postgres://radar:radar@localhost:5432/socle_copie
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='socle' AND pid <> pg_backend_pid();"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE socle_copie TEMPLATE socle"
          DATABASE_URL="$COPIE_URL" pnpm migrate > /tmp/copie-migrate.txt 2>&1
          cat /tmp/copie-migrate.txt
          grep -q 'Aucune migration en attente' /tmp/copie-migrate.txt
          RADAR_DB_INTEGRATION=1 DATABASE_URL="$COPIE_URL" pnpm test:migrations

      - name: Plan du référentiel (sans écriture)
        run: ./apps/api/node_modules/.bin/tsx scripts/load-referentiel-na.mts --plan-only

  # Portes de configuration : elles échouent avant tout test si la chaîne
  # d'approvisionnement régresse (audit de production, images, compose).
  supply-chain:
    needs: changes
    if: needs.changes.outputs.infra == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valeurs jetables : `docker compose config` vérifie les variables
      # obligatoires sans secrets réels.
      POSTGRES_PASSWORD: ci-jetable-sans-secret
      RADAR_AUDIT_PEPPER: ci-jetable-sans-secret

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Audit de production (bloquant)
        run: pnpm audit --prod --audit-level=high

      - name: Validation des fichiers Docker et Compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml --profile tor config --quiet
          docker build --check -f apps/api/Dockerfile .
          docker build --check -f apps/web/Dockerfile .
          docker build --check -f docker/tor/Dockerfile .

  # Nom conservé pour la protection de branche : agrège TOUTES les étapes.
  # Un job filtré par `changes` ou réservé aux événements non-PR est `skipped`
  # et reste acceptable ; seul `changes` lui-même doit être vert. `always()`
  # garantit un verdict même lorsqu'une étape a échoué ou été annulée.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - contracts
      - api-smoke
      - api-tests
      - web-unit
      - playwright
      - sdks-python
      - provenance
      - build
      - socle
      - supply-chain

    steps:
      - name: Toutes les étapes requises doivent être vertes
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.RESULTS);
            const failing = Object.entries(results)
              .filter(([name, value]) => name === "changes"
                ? value.result !== "success"
                : value.result !== "success" && value.result !== "skipped")
              .map(([name, value]) => `${name}:${value.result}`);
            if (failing.length) {
              console.error(`Étapes non vertes : ${failing.join(", ")}`);
              process.exitCode = 1;
            } else {
              console.log("Toutes les étapes requises sont vertes.");
            }
          '
