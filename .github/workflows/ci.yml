name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # Les tests API (detect, quarantine, alerts) écrivent dans PostgreSQL :
    # la base de test est créée et migrée avant la suite.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://radar:radar@localhost:5432/radar

    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Schéma et migrations (base de test)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
          for f in db/migrate-*.sql; do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/sources.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/detection-rules.sql

      - name: Typecheck API
        run: pnpm -F @radar/api typecheck

      - name: Typecheck web
        run: pnpm -F @radar/web typecheck

      - name: Tests API
        run: pnpm -F @radar/api test

      - name: Build web
        run: pnpm -F @radar/web build
